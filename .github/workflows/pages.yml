name: Publicar site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Preparar site
        run: |
          mkdir -p _site
          cp index.html style.css app.js motion.js catalog-data.js _site/
          unzip -q site-assets.zip -d _site
          touch _site/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
